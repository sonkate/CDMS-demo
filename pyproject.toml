[tool.poetry]
name = "cdms"
version = "0.1.0"
description = "Change Data Management Service - Inventory tracking with Exactly-Once semantics"
authors = ["Son <son@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.30" }
psycopg = { extras = ["binary"], version = "^3.2.0" }
openpyxl = "^3.1.5"
faker = "^26.0.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
apscheduler = "^3.10.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^1.4.0"
pytest-cov = "^5.0.0"

[tool.poetry.scripts]
cdms = "src.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
